spring:
  application:
    name: server
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  # 쓰기 API(POST /api/posts) 인증 키. 비어 있으면 쓰기 API는 전부 401
  api-key: ${API_KEY:}

logging:
  level:
    org.hibernate.SQL: debug